<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e293b;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }
    .card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 480px;
    }
    h2 { margin: 0 0 6px; color: #ffffff; text-align: center; font-size: 1.2rem; font-weight: 700; }
    .sub-text { text-align: center; font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; }
    label { display: block; margin-top: 14px; font-weight: 600; color: #cbd5e1; font-size: 0.85rem; }
    
    select, input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      font-family: inherit;
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: #3b82f6; }

    /* カレンダーUI */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .cal-title { font-weight: bold; font-size: 0.95rem; color: #f8fafc; }
    .cal-nav-btn {
      background: #334155;
      border: none;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 8px;
      text-align: center;
    }
    .cal-day-head {
      font-size: 0.75rem;
      font-weight: bold;
      color: #94a3b8;
      padding: 4px 0;
    }
    .cal-day-head.sun { color: #f87171; }
    .cal-day-head.sat { color: #60a5fa; }
    
    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      transition: all 0.15s;
    }
    .cal-cell:hover:not(.empty) { background-color: #334155; }
    .cal-cell.empty { cursor: default; }
    .cal-cell.selected {
      background: #2563eb !important;
      color: white !important;
      font-weight: bold;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
    .cal-cell.today { border: 1px solid #f59e0b; }

    /* 選択済みリスト */
    .selected-summary {
      margin-top: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
    }
    .selected-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      max-height: 80px;
      overflow-y: auto;
    }
    .chip {
      background: #2563eb;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.78rem;
    }

    /* 時間指定ボックス */
    .time-range-box {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
    }
    .time-range-box > div {
      flex: 1;
    }

    button.btn-submit {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transition: opacity 0.2s, transform 0.1s;
    }
    button.btn-submit:active { transform: scale(0.98); opacity: 0.9; }

    #status {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 0.88rem;
      font-weight: bold;
    }
    .loading { background-color: #334155; color: #f8fafc; }
    .success { background-color: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .error { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
  </style>
</head>
<body>

<div class="card">
  <h2>📅 シフト一括申請</h2>
  <div class="sub-text">入れる日をカレンダーで複数ポチポチ選んで送信できます</div>

  <label>👤 ペンネームを選択</label>
  <select id="penName">
    <option value="">-- 選択してください --</option>
    <? for(let i = 0; i < penNameList.length; i++) { ?>
      <option value="<?= penNameList[i] ?>"><?= penNameList[i] ?></option>
    <? } ?>
  </select>

  <!-- カレンダー操作部 -->
  <label>📆 稼働可能日をタップ（複数選択可）</label>
  <div class="cal-header">
    <button class="cal-nav-btn" onclick="prevMonth()">◀ 前月</button>
    <div class="cal-title" id="calMonthTitle"></div>
    <button class="cal-nav-btn" onclick="nextMonth()">翌月 ▶</button>
  </div>
  <div class="cal-grid" id="calDaysHead">
    <div class="cal-day-head sun">日</div>
    <div class="cal-day-head">月</div>
    <div class="cal-day-head">火</div>
    <div class="cal-day-head">水</div>
    <div class="cal-day-head">木</div>
    <div class="cal-day-head">金</div>
    <div class="cal-day-head sat">土</div>
  </div>
  <div class="cal-grid" id="calBody"></div>

  <!-- 選択した日付一覧 -->
  <div class="selected-summary">
    <div>選択した日数: <b id="selectedCount" style="color:#60a5fa;">0</b> 日</div>
    <div class="selected-chips" id="selectedChipsBox">
      <span style="color:#64748b;">日付をタップしてください</span>
    </div>
  </div>

  <!-- 勤務時間帯の形式 -->
  <label>⏰ 稼働時間帯の指定</label>
  <select id="timeMode" onchange="toggleTimeInputs()">
    <option value="allDay">✨ 終日可能（時間合わせられます）</option>
    <option value="custom">⏱️ 時間を指定する（開始〜終了）</option>
    <option value="flexible">💬 各日バラバラ・相談（備考に記載）</option>
  </select>

  <!-- 時間指定が選ばれたときに出るエリア -->
  <div id="customTimeArea" style="display: none; margin-top: 10px;">
    <div class="time-range-box">
      <div>
        <span style="font-size: 0.8rem; color: #94a3b8;">開始時刻</span>
        <input type="time" id="startTime" value="13:00">
      </div>
      <span style="color: #94a3b8; padding-top: 20px;">〜</span>
      <div>
        <span style="font-size: 0.8rem; color: #94a3b8;">終了時刻</span>
        <input type="time" id="endTime" value="21:00">
      </div>
    </div>
  </div>

  <label>📝 備考・各日の詳細（任意）</label>
  <textarea id="note" rows="2" placeholder="例: 15日は終日OK、20日は18時以降のみ。背景パース作業できます！"></textarea>

  <button class="btn-submit" onclick="submitBatchShift()">🚀 選択した日のシフト希望を一括送信</button>
  <div id="status"></div>
</div>

<script>
  let currentDate = new Date();
  let selectedDates = new Set();

  function toggleTimeInputs() {
    const mode = document.getElementById('timeMode').value;
    const customArea = document.getElementById('customTimeArea');
    customArea.style.display = (mode === 'custom') ? 'block' : 'none';
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('calMonthTitle').innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    const calBody = document.getElementById('calBody');
    calBody.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'cal-cell empty';
      calBody.appendChild(emptyDiv);
    }

    for (let d = 1; d <= lastDate; d++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      cell.innerText = d;

      const dateStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
      
      if (selectedDates.has(dateStr)) {
        cell.classList.add('selected');
      }

      if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === d) {
        cell.classList.add('today');
      }

      cell.onclick = () => toggleDate(dateStr, cell);
      calBody.appendChild(cell);
    }
  }

  function toggleDate(dateStr, cell) {
    if (selectedDates.has(dateStr)) {
      selectedDates.delete(dateStr);
      cell.classList.remove('selected');
    } else {
      selectedDates.add(dateStr);
      cell.classList.add('selected');
    }
    updateChips();
  }

  function updateChips() {
    const sorted = Array.from(selectedDates).sort();
    document.getElementById('selectedCount').innerText = sorted.length;
    const box = document.getElementById('selectedChipsBox');

    if (sorted.length === 0) {
      box.innerHTML = '<span style="color:#64748b;">日付をタップしてください</span>';
      return;
    }

    box.innerHTML = '';
    sorted.forEach(d => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerText = d.slice(5);
      box.appendChild(chip);
    });
  }

  function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  function showStatus(text, type) {
    const s = document.getElementById('status');
    s.style.display = 'block';
    s.className = type;
    s.innerText = text;
  }

  function submitBatchShift() {
    const penName = document.getElementById('penName').value;
    const timeMode = document.getElementById('timeMode').value;
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    const note = document.getElementById('note').value;
    const dates = Array.from(selectedDates).sort();

    if (!penName) return alert('ペンネームを選択してください！');
    if (dates.length === 0) return alert('カレンダーから稼働希望日を1日以上選んでください！');

    let timeSlotStr = "終日";
    if (timeMode === 'custom') {
      if (!startTime || !endTime) return alert('開始時刻と終了時刻を入力してください！');
      timeSlotStr = `${startTime}〜${endTime}`;
    } else if (timeMode === 'flexible') {
      timeSlotStr = "相談・備考参照";
    }

    showStatus(`${dates.length}日分のシフト希望を送信中...`, 'loading');

    google.script.run
      .withSuccessHandler(function(res) {
        showStatus(`✅ ${res.count}日分のシフト希望を一括送信しました！`, 'success');
        selectedDates.clear();
        updateChips();
        renderCalendar();
        document.getElementById('note').value = '';
      })
      .withFailureHandler(function(err) {
        showStatus('エラー: ' + err.message, 'error');
      })
      .processBatchShiftRequest({
        penName: penName,
        dates: dates,
        timeMode: timeMode,
        startTime: startTime,
        endTime: endTime,
        timeSlotStr: timeSlotStr,
        note: note
      });
  }

  renderCalendar();
</script>

</body>
</html>
